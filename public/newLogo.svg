<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <linearGradient id="epHubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#4364F7" />
      <stop offset="100%" stop-color="#6FB1FC" />
    </linearGradient>
    
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#001133" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g transform="translate(30, 25)" filter="url(#softShadow)">
    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#epHubGrad)" stroke-width="8" stroke-dasharray="280" stroke-dashoffset="20" />
    
    <circle cx="50" cy="50" r="12" fill="url(#epHubGrad)" />
    
    <line x1="50" y1="18" x2="50" y2="38" stroke="#0052D4" stroke-width="5" stroke-linecap="round" />
    <line x1="50" y1="62" x2="50" y2="82" stroke="#4364F7" stroke-width="5" stroke-linecap="round" />
    <line x1="18" y1="50" x2="38" y2="50" stroke="#4364F7" stroke-width="5" stroke-linecap="round" />
    <line x1="62" y1="50" x2="82" y2="50" stroke="#6FB1FC" stroke-width="5" stroke-linecap="round" />
  </g>

  <g transform="translate(160, 98)">
    <text font-family="Segoe UI, Inter, Arial, sans-serif" font-size="68" font-weight="800" fill="#111827" letter-spacing="-1">ep</text>
    
    <text x="76" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#epHubGrad)" letter-spacing="-1">hub</text>
  </g>
</svg>
